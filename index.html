<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Horario Beats & Buns</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
  :root{
    --bg:#121110;
    --panel:#1c1913;
    --panel-2:#242018;
    --panel-3:#2a2419;
    --border:#3a331f;
    --border-soft:#2b2618;
    --gold:#d9a73c;
    --gold-soft:#c8a96e;
    --text:#f3ecdd;
    --text-dim:#a99b7c;
    --text-faint:#7a6f57;
    --ok:#5fae7c;
    --warn:#e2584a;
    --editable:#2b2412;
    --editable-border:#5c4a1e;
  }
  *{box-sizing:border-box}
  html,body{background:var(--bg);color:var(--text)}
  body{margin:0;font-family:'DM Sans',system-ui,sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
  #app{min-height:100vh;display:flex;flex-direction:column}
  a{color:var(--gold-soft)}
  button{font-family:inherit}
  input,select{font-family:inherit}
  ::selection{background:var(--gold);color:#1a1608}

  .topbar{display:flex;justify-content:space-between;align-items:center;padding:10px 22px;background:var(--panel);
    border-bottom:1px solid var(--border);position:sticky;top:0;z-index:30;flex-wrap:wrap;gap:12px}
  .wordmark{display:flex;align-items:center;gap:12px;line-height:1}
  .wordmark .logo-mark{height:34px;width:auto;display:block}
  .wordmark .word-text{font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:2px;color:var(--gold);line-height:1;display:flex;flex-direction:column;gap:2px}
  .wordmark .eyebrow{font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:3px;color:var(--text-dim);text-transform:uppercase;font-weight:600}

  #splash{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:999;
    transition:opacity .5s ease}
  #splash.hide{opacity:0;pointer-events:none}
  #splash .splash-logo{width:min(64vw,340px);opacity:0;transform:scale(.86);animation:splashIn 900ms cubic-bezier(.2,.8,.2,1) 120ms forwards}
  @keyframes splashIn{
    0%{opacity:0;transform:scale(.86)}
    60%{opacity:1;transform:scale(1.015)}
    100%{opacity:1;transform:scale(1)}
  }
  @media (prefers-reduced-motion: reduce){
    #splash .splash-logo{animation:none;opacity:1;transform:none}
    #splash{transition:none}
  }
  .top-meta{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .role-badge{font-size:11px;letter-spacing:1.5px;text-transform:uppercase;font-weight:700;padding:6px 12px;border-radius:999px;
    border:1px solid var(--gold);color:var(--gold);background:rgba(217,167,60,0.08)}
  .btn{appearance:none;border:1px solid var(--border);background:var(--panel-2);color:var(--text);padding:9px 16px;border-radius:8px;
    font-size:13px;font-weight:600;cursor:pointer;transition:background .15s,border-color .15s,transform .05s;white-space:nowrap}
  .btn:hover{border-color:var(--gold-soft)}
  .btn:active{transform:scale(.98)}
  .btn-gold{background:var(--gold);border-color:var(--gold);color:#1a1608}
  .btn-gold:hover{background:var(--gold-soft);border-color:var(--gold-soft)}
  .btn-ghost{background:transparent}
  .btn-sm{padding:5px 10px;font-size:12px;border-radius:6px}
  .btn:disabled{opacity:.5;cursor:not-allowed}

  .gate-wrap{flex:1;display:flex;align-items:center;justify-content:center;padding:24px}
  .gate{max-width:360px;width:100%;padding:34px 30px;background:var(--panel);border:1px solid var(--border);border-radius:18px;text-align:center}
  .gate h1{font-family:'Bebas Neue';font-size:28px;letter-spacing:1.5px;color:var(--gold);margin:0 0 6px}
  .gate p{color:var(--text-dim);font-size:13.5px;margin:0 0 22px;line-height:1.5}
  .pin-input{width:100%;text-align:center;font-size:26px;letter-spacing:10px;padding:14px 10px;background:var(--editable);
    border:1px solid var(--editable-border);border-radius:10px;color:var(--text);margin-bottom:14px;font-variant-numeric:tabular-nums}
  .pin-input:focus{outline:none;border-color:var(--gold)}
  .gate-error{color:var(--warn);font-size:12.5px;min-height:18px;margin-bottom:10px}
  .gate.shake{animation:shake .35s}
  @keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

  .content{flex:1;width:100%;max-width:1400px;margin:0 auto;padding:22px;display:flex;flex-direction:column;gap:20px}
  .page-head{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:14px}
  .page-title{font-family:'Bebas Neue';font-size:34px;letter-spacing:1px;color:var(--text);margin:0;line-height:1}
  .page-sub{color:var(--text-dim);font-size:13px;margin-top:6px}
  .week-field{display:flex;align-items:center;gap:8px}
  .week-field label{font-size:11px;text-transform:uppercase;letter-spacing:1.5px;color:var(--text-faint)}
  .week-field input[type=text]{background:var(--editable);border:1px solid var(--editable-border);color:var(--text);
    padding:8px 10px;border-radius:8px;font-size:13.5px;font-weight:600;min-width:190px}

  .toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;background:var(--panel);
    border:1px solid var(--border);border-radius:12px;padding:12px 16px}
  .save-status{font-size:12.5px;color:var(--text-dim);display:flex;align-items:center;gap:8px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--text-faint);display:inline-block}
  .dot.dirty{background:var(--gold)}
  .dot.saved{background:var(--ok)}
  .toolbar-actions{display:flex;gap:10px;flex-wrap:wrap}

  .area-block{background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
  .area-title{display:flex;align-items:center;gap:10px}
  .area-title h2{font-family:'Bebas Neue';font-size:20px;letter-spacing:2px;color:var(--gold-soft);margin:0}
  .area-title .count{font-size:11.5px;color:var(--text-faint)}

  .grid-wrap{overflow-x:auto;border:1px solid var(--border-soft);border-radius:10px}
  table{border-collapse:collapse;width:100%;min-width:1360px}
  thead th{background:var(--panel-2);color:var(--text-dim);font-weight:600;font-size:10.5px;letter-spacing:1px;text-transform:uppercase;
    text-align:center;padding:8px 6px;border-bottom:1px solid var(--border);border-right:1px solid var(--border-soft);position:sticky;top:0;z-index:5}
  thead tr.daynames th{background:var(--panel-3);font-size:11.5px;color:var(--gold-soft)}
  td{padding:5px 6px;border-bottom:1px solid var(--border-soft);border-right:1px solid var(--border-soft);text-align:center;font-size:12.5px;vertical-align:middle}
  th.name-col,td.name-col{position:sticky;left:0;background:var(--panel-2);z-index:6;text-align:left;min-width:150px;font-weight:600}
  td.name-col input,td.role-col input{background:transparent;border:1px solid transparent;color:var(--text);padding:4px 5px;border-radius:5px;width:100%;font-size:12.5px;font-weight:600}
  td.role-col input{font-weight:400;color:var(--text-dim)}
  td.name-col input:hover,td.name-col input:focus,td.role-col input:hover,td.role-col input:focus{border-color:var(--editable-border);background:var(--editable);outline:none}
  th.role-col{min-width:150px}
  td.role-col{text-align:left;min-width:150px}
  tr.area-sep td{background:var(--panel-3);text-align:left;font-family:'Bebas Neue';letter-spacing:2px;color:var(--text-faint);font-size:12px;padding:6px 10px}
  input[type=time]{background:var(--editable);border:1px solid var(--editable-border);color:var(--text);border-radius:6px;padding:4px 3px;
    font-size:12px;width:84px;font-variant-numeric:tabular-nums;color-scheme:dark}
  input[type=time]:focus{outline:none;border-color:var(--gold)}
  input::placeholder{color:var(--text-faint);opacity:1}
  td.hours-cell{background:var(--panel-2);font-weight:700;font-variant-numeric:tabular-nums;color:var(--text-dim);min-width:56px}
  td.total-cell{background:var(--panel-3);font-weight:800;font-variant-numeric:tabular-nums;font-size:14px;color:var(--ok);min-width:64px}
  td.total-cell.over{color:var(--warn)}
  td.remove-col{width:34px}
  .row-del{background:transparent;border:1px solid var(--border);color:var(--text-faint);border-radius:6px;width:24px;height:24px;cursor:pointer;font-size:13px;line-height:1}
  .row-del:hover{border-color:var(--warn);color:var(--warn)}
  .add-row{align-self:flex-start}

  .rules{font-size:12px;color:var(--text-faint);line-height:1.7;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:10px;padding:14px 16px}
  .rules b{color:var(--text-dim)}

  .team-table td,.team-table th{font-size:13px}
  .team-table td.shift-cell{font-variant-numeric:tabular-nums}
  .team-table td.libre{color:var(--text-faint);font-style:italic}
  .local-hours-row td{background:var(--panel-3);color:var(--text-dim);font-size:11.5px;font-weight:600}
  .published-meta{font-size:12px;color:var(--text-faint)}

  .footer-links{display:flex;gap:16px;justify-content:center;padding:18px 0 8px;font-size:11.5px;color:var(--text-faint)}
  .footer-links a{color:var(--text-faint);text-decoration:none;border-bottom:1px dotted var(--text-faint)}
  .footer-links a:hover{color:var(--gold-soft);border-color:var(--gold-soft)}

  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--panel-3);border:1px solid var(--gold);
    color:var(--text);padding:11px 18px;border-radius:10px;font-size:13px;box-shadow:0 8px 24px rgba(0,0,0,.4);z-index:100;
    max-width:min(90vw,420px);text-align:center}

  .settings-panel{display:flex;flex-wrap:wrap;gap:14px;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:10px;padding:14px 16px}
  .settings-panel .field{display:flex;flex-direction:column;gap:5px}
  .settings-panel label{font-size:10.5px;text-transform:uppercase;letter-spacing:1px;color:var(--text-faint)}
  .settings-panel input[type=text]{background:var(--editable);border:1px solid var(--editable-border);color:var(--text);padding:6px 8px;border-radius:6px;font-size:12.5px;width:112px}

  .loading{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text-faint);font-size:13px}

  @media (max-width:640px){ .page-title{font-size:26px} .content{padding:14px} }
</style>
</head>

<div id="app"><div class="loading">Cargando horario…</div></div>

<script>
(function(){
  "use strict";

  var DAYS = [
    {key:"tue", label:"MARTES"},{key:"wed", label:"MIÉRCOLES"},{key:"thu", label:"JUEVES"},
    {key:"fri", label:"VIERNES"},{key:"sat", label:"SÁBADO"},{key:"sun", label:"DOMINGO"}
  ];
  var AREA_LABEL = {cocina:"COCINA", servicio:"SERVICIO Y BARRA"};
  var AREA_BY_ROLE = {miguel:"cocina", juan:"servicio"};

  var params = new URLSearchParams(location.search);
  var role = params.get("rol");
  var roleArea = role === "miguel" ? "cocina" : (role === "juan" ? "servicio" : null);

  var state = null;
  var dirty = false;
  var saving = false;
  var appEl = document.getElementById("app");
  var LOGO_SRC = document.getElementById("splash-logo").src;

  // ---------------- API ----------------
  function api(action, payload){
    payload = payload || {};
    payload.action = action;
    return fetch("/api/schedule", {
      method: "POST",
      headers: {"Content-Type":"application/json"},
      body: JSON.stringify(payload)
    }).then(function(res){
      return res.json().then(function(data){ return {status: res.status, ok: res.ok, data: data}; });
    });
  }
  function fetchState(){
    return fetch("/api/schedule", {cache:"no-store"}).then(function(res){
      return res.json().catch(function(){ return null; }).then(function(data){
        if(!res.ok){
          var msg = (data && (data.message || data.error)) ? (data.message || data.error) : ("HTTP " + res.status);
          throw new Error(msg);
        }
        if(!data || !data.draft){ throw new Error("respuesta_invalida"); }
        return data;
      });
    });
  }

  function getCreds(){
    if(!role) return null;
    try{
      var p = localStorage.getItem("bb_pin_" + role);
      return p ? {role: role, pin: p} : null;
    }catch(e){ return null; }
  }
  function setCreds(pin){
    try{ localStorage.setItem("bb_pin_" + role, pin); }catch(e){}
  }
  function clearCreds(){
    try{ localStorage.removeItem("bb_pin_" + role); }catch(e){}
  }

  // ---------------- time math ----------------
  function toMinutes(t){
    if(!t) return null;
    var parts = t.split(":");
    var h = parseInt(parts[0],10), m = parseInt(parts[1],10);
    if(isNaN(h)||isNaN(m)) return null;
    return h*60+m;
  }
  function shiftHours(e,s){
    if(!e || !s) return 0;
    var em = toMinutes(e), sm = toMinutes(s);
    if(em===null || sm===null) return 0;
    var diff = sm-em;
    if(diff < 0) diff += 24*60;
    return diff/60;
  }
  function dayHours(day){
    if(!day) return 0;
    var h1 = day.e1 ? shiftHours(day.e1, day.s1) : 0;
    var h2 = day.e2 ? shiftHours(day.e2, day.s2) : 0;
    return h1+h2;
  }
  function weekHours(emp){
    var t = 0;
    DAYS.forEach(function(d){ t += dayHours(emp.days[d.key]); });
    return t;
  }
  function fmt(n){ return (Math.round(n*10)/10).toFixed(1); }
  function shiftText(day){
    if(!day || !day.e1) return null;
    var t = day.e1 + " - " + day.s1;
    if(day.e2) t += " / " + day.e2 + " - " + day.s2;
    return t;
  }
  function esc(s){
    return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  function showToast(msg, ms){
    var el = document.querySelector(".toast");
    if(el) el.remove();
    el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    document.body.appendChild(el);
    setTimeout(function(){ if(el) el.remove(); }, ms || 3200);
  }

  function setSaveStatus(status){
    var dot = document.querySelector("[data-save-dot]");
    var label = document.querySelector("[data-save-label]");
    if(!dot || !label) return;
    dot.className = "dot" + (status==="dirty" ? " dirty" : status==="saved" ? " saved" : "");
    label.textContent = status==="saving" ? "Guardando…" : status==="dirty" ? "Cambios sin guardar" : "Todo guardado";
  }
  function markDirty(){ dirty = true; setSaveStatus("dirty"); }

  // ---------------- boot ----------------
  var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var splashMinMs = reduceMotion ? 0 : 1100;
  var splashStart = Date.now();
  function hideSplash(){
    var el = document.getElementById("splash");
    if(!el) return;
    var elapsed = Date.now() - splashStart;
    var wait = Math.max(0, splashMinMs - elapsed);
    setTimeout(function(){
      el.classList.add("hide");
      setTimeout(function(){ if(el && el.parentNode) el.parentNode.removeChild(el); }, 550);
    }, wait);
  }

  fetchState().then(function(s){
    state = s;
    render();
    hideSplash();
  }).catch(function(err){
    var detail = err && err.message ? err.message : "error desconocido";
    appEl.innerHTML = '<div class="loading">No se pudo cargar el horario.<br><small style="opacity:.6;font-size:12px">Detalle: ' + esc(detail) + '</small></div>';
    hideSplash();
  });

  function render(){
    if(role && !getCreds()){
      renderGate();
    } else if(roleArea){
      renderEditor(roleArea);
    } else {
      renderTeam();
    }
  }

  function topbar(showLogout){
    var badge = role ? ('<span class="role-badge">' + (role==="miguel"?"Panel de Miguel · Cocina":"Panel de Juan · Servicio y Barra") + '</span>') :
      '<span class="role-badge">Vista del equipo</span>';
    return '' +
      '<div class="topbar">' +
        '<div class="wordmark"><img class="logo-mark" src="' + LOGO_SRC + '" alt="Beats & Buns">' +
          '<span class="word-text"><span class="eyebrow">Crafted Series // 01</span>Horario de turnos</span></div>' +
        '<div class="top-meta">' + badge + (showLogout ? '<button class="btn btn-ghost btn-sm" data-action="logout">Salir</button>' : '') + '</div>' +
      '</div>';
  }

  function renderGate(){
    appEl.innerHTML =
      topbar() +
      '<div class="gate-wrap"><div class="gate" id="gate-card">' +
        '<h1>' + (role==="miguel" ? "Hola, Miguel" : "Hola, Juan") + '</h1>' +
        '<p>Ingresa tu PIN de 4 dígitos para editar el horario de ' + (role==="miguel"?"cocina":"servicio y barra") + '.</p>' +
        '<input type="password" inputmode="numeric" maxlength="4" pattern="[0-9]*" class="pin-input" id="pin-field" placeholder="••••" autocomplete="off">' +
        '<div class="gate-error" id="gate-error"></div>' +
        '<button class="btn btn-gold" id="pin-submit" style="width:100%">Entrar</button>' +
      '</div></div>';
    var field = document.getElementById("pin-field");
    field.focus();
    function tryPin(){
      var val = field.value.trim();
      var btn = document.getElementById("pin-submit");
      btn.disabled = true;
      api("login", {role: role, pin: val}).then(function(res){
        btn.disabled = false;
        if(res.ok && res.data.ok){
          setCreds(val);
          render();
        } else {
          document.getElementById("gate-error").textContent = "PIN incorrecto.";
          var card = document.getElementById("gate-card");
          card.classList.remove("shake"); void card.offsetWidth; card.classList.add("shake");
          field.value = ""; field.focus();
        }
      }).catch(function(){
        btn.disabled = false;
        document.getElementById("gate-error").textContent = "No se pudo verificar. Revisa tu conexión.";
      });
    }
    document.getElementById("pin-submit").addEventListener("click", tryPin);
    field.addEventListener("keydown", function(e){ if(e.key==="Enter") tryPin(); });
  }

  function dayHeaderCells(){ return DAYS.map(function(d){ return '<th colspan="5">' + d.label + '</th>'; }).join(""); }
  function subHeaderCells(){ return DAYS.map(function(){ return '<th>Entra</th><th>Sale</th><th>Entra 2</th><th>Sale 2</th><th>Horas</th>'; }).join(""); }

  function editorRow(emp){
    var total = weekHours(emp);
    var over = total > 40;
    var cells = DAYS.map(function(d){
      var day = emp.days[d.key];
      var hrs = dayHours(day);
      return '' +
        '<td><input type="time" value="' + esc(day.e1) + '" data-emp="' + emp.id + '" data-day="' + d.key + '" data-field="e1"></td>' +
        '<td><input type="time" value="' + esc(day.s1) + '" data-emp="' + emp.id + '" data-day="' + d.key + '" data-field="s1"></td>' +
        '<td><input type="time" value="' + esc(day.e2) + '" data-emp="' + emp.id + '" data-day="' + d.key + '" data-field="e2"></td>' +
        '<td><input type="time" value="' + esc(day.s2) + '" data-emp="' + emp.id + '" data-day="' + d.key + '" data-field="s2"></td>' +
        '<td class="hours-cell" id="hrs-' + emp.id + '-' + d.key + '">' + fmt(hrs) + '</td>';
    }).join("");
    return '' +
      '<tr data-emp-row="' + emp.id + '">' +
        '<td class="name-col"><input type="text" value="' + esc(emp.name) + '" data-emp="' + emp.id + '" data-field="name" placeholder="Nombre"></td>' +
        '<td class="role-col"><input type="text" value="' + esc(emp.role) + '" data-emp="' + emp.id + '" data-field="role" placeholder="Rol"></td>' +
        cells +
        '<td class="total-cell' + (over?" over":"") + '" id="total-' + emp.id + '">' + fmt(total) + '</td>' +
        '<td class="remove-col"><button class="row-del" data-action="remove-emp" data-emp="' + emp.id + '" title="Quitar">✕</button></td>' +
      '</tr>';
  }

  function renderEditor(area){
    var emps = state.draft[area];
    var rows = emps.map(editorRow).join("");
    var otherArea = area === "cocina" ? "servicio" : "cocina";
    appEl.innerHTML =
      topbar(true) +
      '<div class="content">' +
        '<div class="page-head">' +
          '<div><h1 class="page-title">' + AREA_LABEL[area] + '</h1><div class="page-sub">Escribe los horarios de entrada y salida. Las horas se calculan solas. Deja vacío = libre.</div></div>' +
          '<div class="week-field"><label>Semana</label><input type="text" id="week-input" value="' + esc(state.weekLabel) + '"></div>' +
        '</div>' +

        '<div class="toolbar">' +
          '<div class="save-status"><span class="dot" data-save-dot></span><span data-save-label>Todo guardado</span></div>' +
          '<div class="toolbar-actions">' +
            '<button class="btn" id="btn-save">Guardar cambios</button>' +
            '<button class="btn btn-gold" id="btn-publish">Publicar horario final</button>' +
          '</div>' +
        '</div>' +

        '<div class="area-block">' +
          '<div class="area-title"><h2>' + AREA_LABEL[area] + '</h2><span class="count">' + emps.length + ' persona(s)</span></div>' +
          '<div class="grid-wrap"><table>' +
            '<thead>' +
              '<tr class="daynames"><th class="name-col">Nombre</th><th class="role-col">Rol</th>' + dayHeaderCells() + '<th>Total semana</th><th></th></tr>' +
              '<tr><th class="name-col"></th><th class="role-col"></th>' + subHeaderCells() + '<th></th><th></th></tr>' +
            '</thead>' +
            '<tbody id="rows-body">' + rows + '</tbody>' +
          '</table></div>' +
          '<button class="btn btn-ghost btn-sm add-row" id="btn-add-emp">+ Agregar persona</button>' +
        '</div>' +

        '<div class="settings-panel">' +
          '<div class="field"><label>Cambiar tu PIN</label><input type="text" inputmode="numeric" maxlength="4" id="pin-change" placeholder="Nuevo PIN"></div>' +
          '<div class="field" style="justify-content:flex-end"><button class="btn btn-sm" id="btn-pin-save">Actualizar PIN</button></div>' +
        '</div>' +

        '<div class="rules">' +
          '<b>Cómo usar:</b> deja las 4 casillas de un día vacías para marcarlo como LIBRE. Si el <b>Total semana</b> se pone en rojo, esa persona pasa de 40h y genera recargo por horas suplementarias (Código del Trabajo, Art. 55) — avísale a Coky antes de publicar. Jornada ordinaria: 40h/semana, 2 días de descanso, lunes cerrado.' +
        '</div>' +

        '<div class="footer-links">' +
          '<a href="?" target="_blank">Ver horario del equipo</a>' +
          '<a href="?rol=' + otherArea + '" target="_blank">Panel de ' + (otherArea==="cocina"?"Miguel":"Juan") + '</a>' +
        '</div>' +
      '</div>';

    wireEditorEvents(area);
  }

  function wireEditorEvents(area){
    document.querySelector('[data-action="logout"]').addEventListener("click", function(){
      clearCreds();
      render();
    });

    document.getElementById("week-input").addEventListener("change", function(e){
      state.weekLabel = e.target.value;
      markDirty();
      saveSettings();
    });

    document.getElementById("rows-body").addEventListener("input", function(e){
      var t = e.target;
      var empId = t.getAttribute("data-emp");
      if(!empId) return;
      var emp = state.draft[area].find(function(x){ return x.id===empId; });
      if(!emp) return;
      var field = t.getAttribute("data-field");
      if(field === "name" || field === "role"){
        emp[field] = t.value;
      } else {
        var day = t.getAttribute("data-day");
        emp.days[day][field] = t.value;
        var hrsCell = document.getElementById("hrs-" + empId + "-" + day);
        if(hrsCell) hrsCell.textContent = fmt(dayHours(emp.days[day]));
        var total = weekHours(emp);
        var totalCell = document.getElementById("total-" + empId);
        if(totalCell){
          totalCell.textContent = fmt(total);
          totalCell.className = "total-cell" + (total>40 ? " over" : "");
        }
      }
      markDirty();
    });

    document.getElementById("rows-body").addEventListener("click", function(e){
      var btn = e.target.closest('[data-action="remove-emp"]');
      if(!btn) return;
      var empId = btn.getAttribute("data-emp");
      var emp = state.draft[area].find(function(x){ return x.id===empId; });
      if(!emp) return;
      if(!confirm('¿Quitar a "' + emp.name + '" del horario?')) return;
      state.draft[area] = state.draft[area].filter(function(x){ return x.id!==empId; });
      markDirty();
      renderEditor(area);
    });

    document.getElementById("btn-add-emp").addEventListener("click", function(){
      var id = "e" + Date.now().toString(36) + Math.floor(Math.random()*1000);
      var days = {};
      DAYS.forEach(function(d){ days[d.key] = {e1:"",s1:"",e2:"",s2:""}; });
      state.draft[area].push({id:id, name:"", role:"", days:days});
      markDirty();
      renderEditor(area);
      var firstInput = document.querySelector('[data-emp="'+id+'"][data-field="name"]');
      if(firstInput) firstInput.focus();
    });

    document.getElementById("btn-pin-save").addEventListener("click", function(){
      var val = document.getElementById("pin-change").value.trim();
      if(!/^[0-9]{4}$/.test(val)){ showToast("El PIN debe tener 4 dígitos."); return; }
      var creds = getCreds();
      api("change-pin", {role: creds.role, pin: creds.pin, newPin: val}).then(function(res){
        if(res.ok && res.data.ok){
          setCreds(val);
          showToast("PIN actualizado.");
        } else {
          showToast("No se pudo actualizar el PIN.");
        }
      }).catch(function(){ showToast("No se pudo actualizar el PIN."); });
    });

    document.getElementById("btn-save").addEventListener("click", function(){ saveDraft(true); });

    document.getElementById("btn-publish").addEventListener("click", function(){
      if(!confirm("Esto reemplazará el horario que ve todo el equipo con la versión actual del borrador (cocina + servicio/barra). ¿Publicar ahora?")) return;
      saveDraft(false).then(function(ok){
        if(!ok) return;
        var creds = getCreds();
        api("publish", {role: creds.role, pin: creds.pin}).then(function(res){
          if(res.ok){
            state = res.data;
            showToast("Horario final publicado ✓");
          } else {
            showToast("No se pudo publicar. Intenta de nuevo.");
          }
        }).catch(function(){ showToast("No se pudo publicar. Revisa tu conexión."); });
      });
    });

    function saveDraft(showOwnToast){
      var creds = getCreds();
      if(!creds){ showToast("Tu sesión expiró. Vuelve a entrar con tu PIN."); render(); return Promise.resolve(false); }
      if(saving) return Promise.resolve(false);
      saving = true;
      setSaveStatus("saving");
      return api("save-draft", {role: creds.role, pin: creds.pin, employees: state.draft[area]}).then(function(res){
        saving = false;
        if(res.ok){
          dirty = false;
          setSaveStatus("saved");
          if(showOwnToast) showToast("Cambios guardados");
          return true;
        } else if(res.status === 401){
          showToast("Tu PIN ya no es válido. Vuelve a entrar.");
          clearCreds(); render();
          return false;
        } else {
          setSaveStatus("dirty");
          showToast("No se pudo guardar. Intenta de nuevo.");
          return false;
        }
      }).catch(function(){
        saving = false;
        setSaveStatus("dirty");
        showToast("No se pudo guardar. Revisa tu conexión.");
        return false;
      });
    }

    function saveSettings(){
      var creds = getCreds();
      if(!creds) return;
      api("save-settings", {role: creds.role, pin: creds.pin, weekLabel: state.weekLabel, localHours: state.localHours}).then(function(res){
        if(res.ok){ dirty = false; setSaveStatus("saved"); }
      }).catch(function(){});
    }
  }

  function fmtDate(iso){
    if(!iso) return "aún no se ha publicado";
    try{
      var d = new Date(iso);
      return d.toLocaleString("es-EC", {day:"2-digit", month:"short", year:"numeric", hour:"2-digit", minute:"2-digit"});
    }catch(e){ return iso; }
  }

  function renderTeam(){
    var pub = state.published || state.draft;
    var lh = state.localHours;

    function areaRows(area){
      var emps = pub[area];
      return emps.map(function(emp){
        var cells = DAYS.map(function(d){
          var txt = shiftText(emp.days[d.key]);
          return txt ? ('<td class="shift-cell">' + esc(txt) + '</td>') : '<td class="shift-cell libre">LIBRE</td>';
        }).join("");
        return '<tr><td class="name-col">' + esc(emp.name || "—") + '</td><td class="role-col">' + esc(emp.role||"") + '</td>' + cells + '</tr>';
      }).join("");
    }

    appEl.innerHTML =
      topbar() +
      '<div class="content">' +
        '<div class="page-head">' +
          '<div><h1 class="page-title">Horario de la semana</h1><div class="page-sub">' + esc(state.weekLabel) + ' · Lunes cerrado</div></div>' +
          '<div class="published-meta">Última publicación: ' + fmtDate(state.publishedAt) + (state.publishedBy ? (' · por ' + esc(state.publishedBy)) : '') + '</div>' +
        '</div>' +

        '<div class="area-block">' +
          '<div class="grid-wrap"><table class="team-table">' +
            '<thead><tr class="daynames"><th class="name-col">Colaborador</th><th class="role-col">Cargo</th>' +
              DAYS.map(function(d){ return '<th>'+d.label+'</th>'; }).join("") +
            '</tr></thead>' +
            '<tbody>' +
              '<tr class="local-hours-row"><td class="name-col">Horario local</td><td class="role-col"></td>' +
                DAYS.map(function(d){ return '<td>'+esc(lh[d.key]||"")+'</td>'; }).join("") +
              '</tr>' +
              '<tr class="area-sep"><td colspan="8">— COCINA —</td></tr>' +
              areaRows("cocina") +
              '<tr class="area-sep"><td colspan="8">— SERVICIO Y BARRA —</td></tr>' +
              areaRows("servicio") +
            '</tbody>' +
          '</table></div>' +
        '</div>' +

        '<div class="footer-links">' +
          '<a href="?rol=juan" target="_blank">Panel de Juan</a>' +
          '<a href="?rol=miguel" target="_blank">Panel de Miguel</a>' +
        '</div>' +
      '</div>';
  }

  // refresh the team view periodically / on refocus so a new publish shows up without a manual reload
  setInterval(function(){
    if(role) return; // don't clobber an editor mid-edit
    fetchState().then(function(s){ state = s; if(!roleArea) renderTeam(); }).catch(function(){});
  }, 20000);
  document.addEventListener("visibilitychange", function(){
    if(document.visibilityState === "visible" && !role){
      fetchState().then(function(s){ state = s; renderTeam(); }).catch(function(){});
    }
  });
})();
</script>
</body>
</html>
